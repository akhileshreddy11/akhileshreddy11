name: Update GitHub Profile Dashboard

on:
  push:
    branches:
      - main
    paths-ignore:
      - assets/github-dashboard.svg
  schedule:
    # Refresh live GitHub metrics every hour.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate live dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_github_dashboard.py

      - name: Commit dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-dashboard.svg
          if git diff --cached --quiet; then
            echo "Dashboard is already current."
          else
            git commit -m "chore: refresh live GitHub dashboard"
            git push
          fi
